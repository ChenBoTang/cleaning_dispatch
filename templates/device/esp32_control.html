<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ESP32 控制面板</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft JhengHei",
                sans-serif;

            background: #f3f4f6;
            color: #1f2937;
        }

        .container {
            max-width: 700px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 30px;
        }

        .device {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .online {
            color: #16a34a;
            font-weight: bold;
        }

        .led-box {
            background: #f9fafb;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            margin-top: 25px;
        }

        .led {
            font-size: 70px;
            margin: 10px;
        }

        .state {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .on-button {
            background: #22c55e;
            color: white;
        }

        .off-button {
            background: #374151;
            color: white;
        }

        .message {
            margin-top: 20px;
            text-align: center;
            min-height: 24px;
            font-weight: bold;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>ESP32 控制面板</h1>

        <div class="device">
            裝置：
            <strong>{{ device }}</strong>
        </div>

        <div>
            狀態：
            <span class="online">● Online</span>
        </div>

        <div class="led-box">

            <div class="led" id="led">
                {% if command == "ON" %}
                    🟢
                {% else %}
                    ⚫
                {% endif %}
            </div>

            <div class="state" id="state">
                LED：
                {% if command == "ON" %}
                    ON
                {% else %}
                    OFF
                {% endif %}
            </div>

            <div class="buttons">

                <button
                    class="on-button"
                    onclick="setCommand('ON')">
                    🟢 LED ON
                </button>

                <button
                    class="off-button"
                    onclick="setCommand('OFF')">
                    ⚫ LED OFF
                </button>

            </div>

            <div class="message" id="message"></div>

        </div>

        <a class="back" href="/">
            ← 返回首頁
        </a>

    </div>

</div>


<script>

async function setCommand(command) {

    const message = document.getElementById("message");
    const led = document.getElementById("led");
    const state = document.getElementById("state");

    message.textContent = "正在送出指令...";

    try {

        const response = await fetch("/esp32/set-command/", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                command: command
            })

        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "指令傳送失敗");
        }

        if (data.command === "ON") {

            led.textContent = "🟢";
            state.textContent = "LED：ON";

        } else {

            led.textContent = "⚫";
            state.textContent = "LED：OFF";

        }

        message.textContent = "指令已成功送出";

    } catch (error) {

        message.textContent =
            "錯誤：" + error.message;

    }
}

</script>

</body>
</html>
