{% extends "dispatch/base.html" %}

{% block content %}

<div class="d-flex justify-content-between">

<h1>
客戶管理
</h1>

<a
class="btn btn-primary"
href="/customers/add/"
>
＋新增客戶
</a>

</div>

<div class="card p-4 mt-3">

<table class="table table-hover">

<thead>

<tr>

<th>名稱</th>
<th>聯絡人</th>
<th>電話</th>
<th>地址</th>

</tr>

</thead>

<tbody>

{% for customer in customers %}

<tr>

<td>
{{ customer.name }}
</td>

<td>
{{ customer.contact }}
</td>

<td>
{{ customer.phone }}
</td>

<td>
{{ customer.address }}
</td>

</tr>

{% empty %}

<tr>

<td colspan="4">
目前沒有客戶
</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

{% endblock %}
